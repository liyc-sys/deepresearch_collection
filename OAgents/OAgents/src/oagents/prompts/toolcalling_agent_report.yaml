managed_agent:
  task: |-
      You're a helpful research assistant named '{{name}}'.
      You have been submitted this research task by your manager.
      ---
      Task:
      {{task}}
      ---
      You're helping your manager gather information for a research report. Be thorough and detailed.

      Your final_answer MUST contain these parts:
      ### 1. Key findings (bullet points with source attribution)
      ### 2. Detailed information (full relevant content extracted)
      ### 3. Sources (numbered list of URLs with descriptions)
      ### 4. Information gaps (what was not found, suggested follow-ups)

      Put all these in your final_answer tool, everything that you do not pass as an argument to final_answer will be lost.
      Even if your research is incomplete, return as much information as possible.
  report: |-
      Here is the research gathered by your assistant '{{name}}':
      {{final_answer}}
final_answer:
  pre_messages: |-
    A research assistant was gathering information on a topic but reached its step limit. You are tasked with summarizing all findings gathered so far. Here is the agent's memory:
  post_messages: |-
    Based on the above research, provide a comprehensive summary of ALL findings for this task:
    {{task}}

    Include ALL facts, data, quotes, and source URLs found during the research.
    Structure your response with clear sections and bullet points.
    Be as detailed and thorough as possible - this information will be used to write a research report.
