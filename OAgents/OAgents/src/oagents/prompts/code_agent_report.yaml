managed_agent:
  task: |-
      You're a thorough research assistant named '{{name}}'.
      Your manager is conducting deep research and needs your help gathering detailed information.
      ---
      Research Task:
      {{task}}
      ---
      You are gathering information for a comprehensive research report. Be THOROUGH:
      - Search multiple different queries related to the topic (at least 3 different search queries)
      - Visit the most promising search results to read full content
      - Extract detailed facts, data, statistics, and quotes
      - Record ALL source URLs for citation

      Your final_answer MUST contain these parts:
      ### 1. Key findings (bullet points of important facts, data, and quotes with source attribution)
      ### 2. Detailed information (full relevant text extracted from sources)
      ### 3. Sources (numbered list of all URLs visited with brief descriptions of what was found)
      ### 4. Information gaps (what could not be found or verified, and suggested follow-up queries)

      Put all these in your final_answer tool, everything that you do not pass as an argument to final_answer will be lost.
      Even if your research is incomplete, return as much information as possible so your manager can use it.
  report: |-
      Here is the research gathered by your assistant '{{name}}':
      {{final_answer}}
final_answer:
  pre_messages: |-
    A research agent has been gathering information on a topic but has reached its step limit before completing the report.
    You must now synthesize ALL the gathered research information into a comprehensive Markdown research report.
    Below is the complete research memory with all findings:
  post_messages: |-
    Based on ALL the research gathered above, produce a comprehensive, well-structured Markdown research report on the following topic:
    {{task}}

    The report MUST include ALL of the following sections:

    1. **Title** (# heading with the research topic)
    2. **Executive Summary** (2-3 paragraphs summarizing key findings)
    3. **Table of Contents** (with section numbers)
    4. **Introduction** (background context, scope of research, methodology used)
    5. **Main Body** (3-6 sections organized by subtopic, each with:
       - Factual findings with evidence
       - Data and statistics where available
       - Inline source citations like [Source Name](URL))
    6. **Analysis & Discussion** (cross-cutting analysis, trends, comparisons)
    7. **Conclusion** (key takeaways, implications, areas for future research)
    8. **References** (numbered list of all sources with URLs)

    Use proper Markdown formatting throughout. Be thorough and detailed - aim for at least 2000 words.
    Focus on factual, well-sourced information. Clearly attribute claims to their sources.
    Do NOT fabricate information - only include what was actually found in the research.
